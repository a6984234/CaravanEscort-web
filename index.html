<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>護送馬車 Caravan Escort</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #1d2a1d; overflow: hidden;
      /* 手機上禁止捲動、縮放、長按選取，觸控全部交給遊戲 */
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #1d2a1d; outline: none; }
    .overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      padding: 24px; box-sizing: border-box; text-align: center;
      color: #f3e3b5; background: #1d2a1d; font: 18px/1.5 system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif;
    }
    #bar { width: min(60vw, 320px); height: 10px; border: 1px solid #f3e3b5; border-radius: 6px; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #e3b04b; transition: width .2s; }
    #rotate { display: none; z-index: 10; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading" class="overlay">
    <div>護送馬車　載入中…</div>
    <div id="bar"><div id="fill"></div></div>
  </div>
  <div id="rotate" class="overlay">請將手機轉為橫向遊玩</div>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "CaravanEscort",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      // 高解析度手機限制在 2 倍，避免畫面太大拖慢效能
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    var loading = document.getElementById("loading");
    var script = document.createElement("script");
    script.src = buildUrl + "/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(document.getElementById("unity-canvas"), config, function (progress) {
        document.getElementById("fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        loading.remove();
      }).catch(function (message) {
        loading.textContent = "載入失敗：" + message;
      });
    };
    script.onerror = function () { loading.textContent = "載入失敗：找不到遊戲檔案"; };
    document.body.appendChild(script);
  </script>
</body>
</html>
